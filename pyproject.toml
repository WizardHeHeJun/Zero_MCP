# Zero_MCP · Python 侧依赖与工具配置（骨架）
# conda 管解释器与环境（environment.yml，环境名 ai-harness）；Python 包用 uv 管理本文件。
# 运行依赖随 src/ 实现补充（当前多数注释占位）；构建/打包待代码落地后定。

[project]
name = "zero-mcp"
version = "0.0.0"
description = "Zero_MCP —— 经 MCP 给 AI 数字人 Zero 加新 Agent 能力模块（Python 主 + TS MCP 层）"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=0.4",     # 编排层 StateGraph / interrupt / Checkpointer（Task 10 起用）
    "jinja2>=3.1",        # prompt 模板（Task 11，模板与代码分离）
    "pydantic>=2.0",      # 结构化 state / 感知契约校验（Task 2 起用）
    # —— 屏幕能力 MCP 层（Task 3-6，CPU 全功能兜底=硬前提 3）——
    "mcp>=1.0,<2.0",              # 官方 python-sdk（FastMCP + ClientSession + stdio）
    "httpx>=0.27",                # streamable_http_client 的 http_client（Bearer 注入）；mcp 已传递引入
    "python-dotenv>=1.0",         # .env 读取
    "mss>=9.0",                   # 截图
    "pillow>=10.0",               # 图像管道 / OCR 预处理
    "rapidocr-onnxruntime>=1.3",  # CPU OCR（自动拉 onnxruntime CPU 版）
    "pywinauto>=0.6.8",           # UIA 操控
    "uiautomation>=2.0",          # UIA COM 遍历（自 poc extras 升 base）
    "pyautogui>=0.9.54",          # 坐标点击 / 快捷键
    "pyperclip>=1.8",             # 剪贴板中文输入
    "pywin32>=306",               # Win32 API
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.10",
    "types-pywin32",
]
poc = [
    # 蓝图 §10 Task 1：UIA 覆盖率 PoC（tests/poc/）；已随 Task 3-6 升 base，保留兼容
    "uiautomation>=2.0",
    "pywinauto>=0.6.8",
]
# GPU 为可选加速（硬前提 3）：EP 自适应 CUDA>DirectML>CPU
gpu-cuda = [
    "onnxruntime-gpu>=1.18",
    "pynvml>=11.0",
]
gpu-dml = [
    "onnxruntime-directml>=1.18",
]
# 真硬件采集（io_adapters/hardware_adapters.py）——**可选**，默认不装。
# 缺库时对应工厂返回的 callable 产 None，Channel 走「本轮无证据」优雅回退，故不装也不阻断。
# 摄像头走 opencv（已随 perception-vision 提供），无需独立 extra。
hardware-audio = [
    "sounddevice>=0.4",  # 麦克风实时采集（PortAudio 绑定）
]
hardware-wearable = [
    "pyserial>=3.5",  # 串口可穿戴设备（ECG/EDA 采集板）
]
physio = [
    "neurokit2>=0.2",
    "pandas>=2.0",
    "numpy>=1.24",
    "cvxopt>=1.3",  # cvxEDA 分解（rate>4Hz）；缺则 EdaChannel 自动降级 highpass（rate≤4Hz）
]
# zero-link §5.1 语音感知通道（AudioChannel）：audeering w2v2 维度 SER（torch/transformers）。
# 权重走 .env ZERO_AUDIO_MODEL_PATH；librosa 仅 I/O 适配层加载 wav 用，Channel 核心不需。
perception-audio = [
    "torch>=2.0",
    "transformers>=4.30",
    "numpy>=1.24",
]
# zero-link §5.1 视觉感知通道（VisionChannel）：EmotiEffLib ONNX 后端（零 timm，绕过 gap-1）。
# 模型走 .env ZERO_VISION_MODEL_NAME/DIR；onnx+onnxruntime+opencv 由 emotiefflib 传递引入。
perception-vision = [
    "emotiefflib>=1.1",
    "onnxruntime>=1.16",
    "numpy>=1.24",
]
omniparser = [
    "torch>=2.0",  # OmniParser 推理依赖；模型走 .env OMNIPARSER_MODEL_DIR 本地目录
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

# Task 4/5 中延迟 import 的第三方库（uiautomation、rapidocr_onnxruntime、mss、
# numpy）无 py.typed / stubs，ignore_missing_imports 消除 [import-untyped]。
# ignore_errors 不用——只豁免真正无 stubs 的库，代码自身类型错误仍须修正。
[[tool.mypy.overrides]]
module = [
    "uiautomation",
    "rapidocr_onnxruntime",
    "mss",
    "numpy",
    "PIL",
    "PIL.Image",
    "pyautogui",
    "pyperclip",
    "neurokit2",
    "emotiefflib",
    "emotiefflib.facial_analysis",
    "onnxruntime",
    "librosa",
    # 真硬件采集库（可选 extra，默认不装；延迟 import + 缺库优雅回退）
    "sounddevice",
    "serial",
    "serial.tools",
    "serial.tools.list_ports",
]
ignore_missing_imports = true

# transformers 5.x 自带 py.typed，但其内部大量 untyped 调用（__init_subclass__/post_init/
# from_pretrained 装饰器）在 strict 下与自定义 EmotionModel 子类冲突。follow_imports=skip
# 将其视作 Any（子类需 ignore[misc]），只豁免这个 ML 边界；torch 仍按 stubs 严格检查。
[[tool.mypy.overrides]]
module = ["transformers", "transformers.*"]
follow_imports = "skip"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# -ra：摘要里打印 skip/xfail 原因。zerorepo 跨仓用例缺前置即 skip，默认输出不显示原因时
# 「覆盖静默归零」不可见（见 tests/mcp/conftest.py 的 ZERO_LINK_E2E_STRICT 守卫）。
addopts = ["-ra"]
markers = [
    "realenv: 需要真实桌面环境（实机手动运行，CI 跳过）",
    "zerorepo: 需 D:\\Zero 源码在位的跨仓契约回归（缺失即 skip）",
]
